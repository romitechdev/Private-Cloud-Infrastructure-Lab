services:
  # 1. Database Service
  postgres:
    image: postgres:16-alpine
    container_name: infra-postgres
    restart: always
    environment:
      POSTGRES_DB: infradb
      POSTGRES_USER: infrauser
      POSTGRES_PASSWORD: InfraSecurePass123!
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - internal-net

  # 2. Backend API Service
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: infra-backend
    restart: always
    environment:
      DB_HOST: postgres
    depends_on:
      - postgres
    volumes:
      - /proc:/proc:ro
    networks:
      - internal-net

  # 3. Frontend & Reverse Proxy Service
  nginx:
    image: nginx:alpine
    container_name: infra-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./app/frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - internal-net

  # 4. Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: infra-node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - internal-net

  # 5. Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: infra-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - node-exporter
    networks:
      - internal-net

  # 6. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: infra-grafana
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - internal-net

  # 7. Loki (Log Storage & Engine)
  loki:
    image: grafana/loki:latest
    container_name: infra-loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - internal-net

  # 8. Promtail (Log Collector Agent)
  promtail:
    image: grafana/promtail:latest
    container_name: infra-promtail
    restart: always
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - internal-net

volumes:
  pgdata:
  promdata:
  grafanadata:

networks:
  internal-net:
    driver: bridge
