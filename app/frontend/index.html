<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Infrastructure Dashboard</title>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #ffffff;
            --surface-2: #f6f7f9;
            --border: #e5e7eb;
            --text: #111827;
            --text-dim: #4b5563;
            --text-faint: #9ca3af;
            --accent: #059669;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2.5rem 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 860px; margin: 0 auto; }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 1.25rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        .title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .clock {
            font-size: 0.75rem;
            color: var(--text-faint);
            letter-spacing: 0.05em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }

        .card {
            background: var(--surface);
            padding: 1.1rem 1.25rem;
        }

        .card-label {
            font-size: 0.65rem;
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.6rem;
        }

        .card-value {
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-value.accent { color: var(--accent); font-weight: 600; }

        .section-title {
            font-size: 0.7rem;
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 2rem 0 0.75rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            font-size: 0.82rem;
        }

        th {
            text-align: left;
            padding: 0.6rem 1rem;
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 0.55rem 1rem;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
        }

        tr:last-child td { border-bottom: none; }

        tbody tr { background: var(--surface); }
        tbody tr:hover { background: var(--surface-2); }

        .empty {
            text-align: center;
            color: var(--text-faint);
            padding: 1.5rem !important;
        }

        @media (max-width: 720px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title"><span class="dot"></span>Private Cloud Dashboard</div>
            <div class="clock" id="clock"></div>
        </header>

        <div class="grid">
            <div class="card"><div class="card-label">Hostname</div><div class="card-value" id="hostname">—</div></div>
            <div class="card"><div class="card-label">Kernel</div><div class="card-value" id="kernel">—</div></div>
            <div class="card"><div class="card-label">Uptime</div><div class="card-value accent" id="uptime">—</div></div>
            <div class="card"><div class="card-label">RAM</div><div class="card-value accent" id="ram">—</div></div>
            <div class="card"><div class="card-label">Load 1m / 5m</div><div class="card-value" id="load">—</div></div>
        </div>

        <div class="section-title">PostgreSQL Metrics History</div>
        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>RAM Used</th>
                    <th>RAM Total</th>
                    <th>Load 1m</th>
                </tr>
            </thead>
            <tbody id="history-body">
                <tr><td colspan="4" class="empty">Loading…</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        function tickClock() {
            document.getElementById('clock').textContent =
                new Date().toLocaleTimeString('en-GB', { hour12: false });
        }
        tickClock();
        setInterval(tickClock, 1000);

        async function updateDashboard() {
            try {
                const resMetrics = await fetch('/api/metrics');
                const metrics = await resMetrics.json();
                document.getElementById('hostname').textContent = metrics.hostname;
                document.getElementById('kernel').textContent = metrics.kernel;
                document.getElementById('uptime').textContent = metrics.uptime_hours + ' hrs';
                document.getElementById('ram').textContent =
                    metrics.ram.used_mb + ' / ' + metrics.ram.total_mb + ' MB';
                document.getElementById('load').textContent =
                    metrics.load_avg['1m'] + ' / ' + metrics.load_avg['5m'];

                const resHistory = await fetch('/api/history');
                const dataHistory = await resHistory.json();
                const tbody = document.getElementById('history-body');
                if (!dataHistory.history.length) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty">No data</td></tr>';
                    return;
                }
                tbody.innerHTML = dataHistory.history.map(item =>
                    '<tr>' +
                    '<td>' + item.timestamp + '</td>' +
                    '<td>' + item.ram_used_mb + ' MB</td>' +
                    '<td>' + item.ram_total_mb + ' MB</td>' +
                    '<td>' + item.load_1m + '</td>' +
                    '</tr>'
                ).join('');
            } catch (err) {
                console.error('Dashboard sync error:', err);
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 3000);
    </script>
</body>
</html>
