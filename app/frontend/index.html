<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Infrastructure Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
        .container { max-width: 900px; margin: auto; }
        h1 { border-bottom: 2px solid #334155; padding-bottom: 0.5rem; font-size: 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
        .card { background: #1e293b; padding: 1.25rem; border-radius: 8px; border: 1px solid #334155; }
        .card-title { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
        .card-value { font-size: 1.3rem; font-weight: bold; margin-top: 0.5rem; color: #38bdf8; }
        .status-dot { height: 10px; width: 10px; background-color: #22c55e; border-radius: 50%; display: inline-block; margin-right: 6px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 2rem; background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { background: #0f172a; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <h1><span class="status-dot"></span>Private Cloud Dashboard (Dockerized)</h1>
        <div class="grid">
            <div class="card"><div class="card-title">Hostname</div><div class="card-value" id="hostname">-</div></div>
            <div class="card"><div class="card-title">Kernel</div><div class="card-value" id="kernel" style="font-size: 0.95rem;">-</div></div>
            <div class="card"><div class="card-title">Uptime</div><div class="card-value" id="uptime">-</div></div>
            <div class="card"><div class="card-title">RAM Usage</div><div class="card-value" id="ram">-</div></div>
            <div class="card"><div class="card-title">Load Avg</div><div class="card-value" id="load" style="font-size: 1rem;">-</div></div>
        </div>

        <h2 style="margin-top: 2rem; font-size: 1.2rem; color: #cbd5e1;">PostgreSQL Metrics History</h2>
        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>RAM Used</th>
                    <th>RAM Total</th>
                    <th>Load 1m</th>
                </tr>
            </thead>
            <tbody id="history-body">
                <tr><td colspan="4">Loading history...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function updateDashboard() {
            try {
                // 1. Fetch Realtime Metrics (Sekaligus write snapshot ke Postgres)
                const resMetrics = await fetch('/api/metrics');
                const metrics = await resMetrics.json();
                document.getElementById('hostname').innerText = metrics.hostname;
                document.getElementById('kernel').innerText = metrics.kernel;
                document.getElementById('uptime').innerText = `${metrics.uptime_hours} hrs`;
                document.getElementById('ram').innerText = `${metrics.ram.used_mb} / ${metrics.ram.total_mb} MB`;
                document.getElementById('load').innerText = `${metrics.load_avg['1m']} | ${metrics.load_avg['5m']}`;

                // 2. Fetch History dari PostgreSQL
                const resHistory = await fetch('/api/history');
                const dataHistory = await resHistory.json();
                const tbody = document.getElementById('history-body');
                tbody.innerHTML = '';
                dataHistory.history.forEach(item => {
                    const row = `<tr>
                        <td>${item.timestamp}</td>
                        <td>${item.ram_used_mb} MB</td>
                        <td>${item.ram_total_mb} MB</td>
                        <td>${item.load_1m}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                console.error("Dashboard Sync Error:", err);
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 3000);
    </script>
</body>
</html>
