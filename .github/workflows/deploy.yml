name: CI/CD Deployment Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    name: 1. Code Testing & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax & Lint Check
        run: |
          python -m py_compile app/backend/main.py
          echo "Syntax check passed!"

  deploy:
    name: 2. Automated Deploy to Lab VM
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote SSH deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            /home/romi/private-cloud-infrastructure-lab/scripts/deploy.sh
